<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disclosure Press Scout</title>
</head>
<body>
<h1>Disclosure Press Scout</h1>

<input id="queryInput" type="search" value="UFO">
<button id="runScoutButton" type="button">Run Scout</button>

<div id="status">Ready.</div>
<div id="results"></div>

<script>
const WORKER_URL = "https://disclosure-press-scout-api.disclosurepress.workers.dev/";

const runScoutButton = document.getElementById("runScoutButton");
const queryInput = document.getElementById("queryInput");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("results");

runScoutButton.addEventListener("click", runScout);

function setStatus(message) {
    statusBox.textContent = message;
}

function renderArticles(articles) {
    resultsBox.innerHTML = "";

    if (!articles.length) {
        resultsBox.textContent = "No articles found.";
        return;
    }

    articles.forEach(article => {
        const card = document.createElement("article");

        const title = document.createElement("h2");
        const link = document.createElement("a");
        link.href = article.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = article.title || "Untitled article";
        title.appendChild(link);

        const source = document.createElement("p");
        source.textContent = article.source || "Unknown source";

        const description = document.createElement("p");
        description.textContent = article.description || "";

        card.append(title, source, description);
        resultsBox.appendChild(card);
    });
}

async function runScout() {
    const requestUrl = new URL(WORKER_URL);
    requestUrl.searchParams.set("q", queryInput.value.trim() || "UFO");

    setStatus("Scanning sources...");
    resultsBox.innerHTML = "";

    try {
        const response = await fetch(requestUrl.toString(), {
            headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
            throw new Error("Worker returned " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.articles)) {
            throw new Error("Worker JSON did not include articles.");
        }

        renderArticles(data.articles);
        setStatus("Scout complete. " + data.articles.length + " articles found.");
    } catch (error) {
        setStatus("Fetch error: " + error.message);
    }
}
</script>
</body>
</html>
