<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disclosure Press Scout</title>
<style>
:root {
    color-scheme: light;
    --bg: #f3f5f7;
    --panel: #ffffff;
    --ink: #101418;
    --muted: #5d6875;
    --line: #d9dee5;
    --accent: #135f7a;
    --accent-dark: #0d465a;
    --danger: #8a1f11;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
}

.page {
    width: min(1120px, calc(100% - 32px));
    margin: 24px auto;
}

.shell {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 22px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 0;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: 1px solid var(--accent-dark);
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
}

button:hover:not(:disabled) {
    background: var(--accent-dark);
}

button:disabled {
    cursor: wait;
    opacity: 0.7;
}

.secondary-button {
    border-color: #9aa5b1;
    background: #fff;
    color: var(--ink);
}

.secondary-button:hover:not(:disabled) {
    background: #edf1f4;
}

.status {
    margin: 18px 0 0;
    border: 1px solid var(--line);
    background: #f9fafb;
    padding: 11px 12px;
    color: var(--muted);
}

.status.error {
    border-color: #e4b5ad;
    background: #fff6f4;
    color: var(--danger);
}

.results {
    display: grid;
    gap: 12px;
    margin-top: 18px;
}

.article-card {
    border: 1px solid var(--line);
    background: #fff;
    padding: 15px;
}

.article-title {
    margin: 0 0 8px;
    font-size: 18px;
    line-height: 1.35;
}

.article-title a {
    color: var(--ink);
    text-decoration: none;
}

.article-title a:hover {
    text-decoration: underline;
}

.article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 13px;
}

.article-description {
    margin: 0 0 12px;
    color: #28313a;
    line-height: 1.45;
}

.article-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.empty {
    margin: 0;
    padding: 16px 0;
    color: var(--muted);
}

.diagnostics {
    display: none;
    margin-top: 18px;
    border: 1px solid var(--line);
    background: #fbfcfd;
    padding: 14px;
}

.diagnostics.visible {
    display: block;
}

.metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
}

.metric {
    border: 1px solid var(--line);
    background: #fff;
    padding: 10px;
}

.metric-label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 5px;
}

.metric-value {
    display: block;
    font-size: 22px;
    font-weight: 700;
}

.source-list,
.feed-list {
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
}

.source-list li,
.feed-list li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--line);
    padding: 8px 0;
    color: var(--muted);
}

.source-list strong,
.feed-list strong {
    color: var(--ink);
}

.diagnostic-heading {
    margin: 16px 0 0;
    font-size: 15px;
}

@media (max-width: 720px) {
    .topbar,
    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>
<body>
<main class="page">
    <section class="shell" aria-labelledby="pageTitle">
        <div class="topbar">
            <h1 id="pageTitle">Disclosure Press Scout</h1>
            <div class="controls">
                <button id="runScoutButton" type="button">Run Scout</button>
                <button id="loadMetricsButton" class="secondary-button" type="button">Metrics</button>
            </div>
        </div>

        <div class="status" id="status" role="status">Ready.</div>
        <div class="diagnostics" id="diagnostics" aria-live="polite"></div>
        <div class="results" id="results" aria-live="polite"></div>
    </section>
</main>

<script>
const WORKER_URL = "https://disclosure-press-scout-api.disclosurepress.workers.dev/";

let currentResults = [];

const runScoutButton = document.getElementById("runScoutButton");
const loadMetricsButton = document.getElementById("loadMetricsButton");
const statusBox = document.getElementById("status");
const diagnosticsBox = document.getElementById("diagnostics");
const resultsBox = document.getElementById("results");

runScoutButton.addEventListener("click", runScout);
loadMetricsButton.addEventListener("click", loadMetrics);

function setStatus(message, isError = false) {
    statusBox.textContent = message;
    statusBox.classList.toggle("error", isError);
}

function clearResults(message = "") {
    resultsBox.innerHTML = "";

    if (message) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = message;
        resultsBox.appendChild(empty);
    }
}

function clearDiagnostics() {
    diagnosticsBox.innerHTML = "";
    diagnosticsBox.classList.remove("visible");
}

function metricTile(label, value) {
    const tile = document.createElement("div");
    tile.className = "metric";

    const labelEl = document.createElement("span");
    labelEl.className = "metric-label";
    labelEl.textContent = label;

    const valueEl = document.createElement("span");
    valueEl.className = "metric-value";
    valueEl.textContent = value;

    tile.append(labelEl, valueEl);
    return tile;
}

function renderSourceList(title, sourceCounts) {
    if (!Array.isArray(sourceCounts) || !sourceCounts.length) {
        return null;
    }

    const heading = document.createElement("h3");
    heading.className = "diagnostic-heading";
    heading.textContent = title;

    const list = document.createElement("ul");
    list.className = "source-list";

    sourceCounts.slice(0, 12).forEach(item => {
        const row = document.createElement("li");
        const source = document.createElement("strong");
        source.textContent = item.source;
        const count = document.createElement("span");
        count.textContent = String(item.count);
        row.append(source, count);
        list.appendChild(row);
    });

    const fragment = document.createDocumentFragment();
    fragment.append(heading, list);
    return fragment;
}

function renderFeedList(feeds) {
    if (!Array.isArray(feeds) || !feeds.length) {
        return null;
    }

    const heading = document.createElement("h3");
    heading.className = "diagnostic-heading";
    heading.textContent = "Feed health";

    const list = document.createElement("ul");
    list.className = "feed-list";

    feeds
        .slice()
        .sort((a, b) => (b.relevantCount || 0) - (a.relevantCount || 0) || a.name.localeCompare(b.name))
        .slice(0, 12)
        .forEach(feed => {
            const row = document.createElement("li");
            const name = document.createElement("strong");
            name.textContent = feed.ok ? feed.name : `${feed.name} issue`;
            const counts = document.createElement("span");
            counts.textContent = feed.ok
                ? `${feed.rawCount || 0} raw / ${feed.relevantCount || 0} relevant`
                : feed.error || "Fetch failed";
            row.append(name, counts);
            list.appendChild(row);
        });

    const fragment = document.createDocumentFragment();
    fragment.append(heading, list);
    return fragment;
}

function renderNewsApiStatus(newsApi) {
    if (!newsApi) {
        return null;
    }

    const heading = document.createElement("h3");
    heading.className = "diagnostic-heading";
    heading.textContent = "NewsAPI status";

    const list = document.createElement("ul");
    list.className = "feed-list";

    const row = document.createElement("li");
    const name = document.createElement("strong");
    name.textContent = newsApi.warning ? "NewsAPI issue" : "NewsAPI working";
    const counts = document.createElement("span");
    counts.textContent = newsApi.warning
        ? newsApi.warning
        : `${newsApi.rawCount || 0} raw / ${newsApi.recentCount || 0} recent / ${newsApi.relevantCount || 0} relevant`;
    row.append(name, counts);
    list.appendChild(row);

    const fragment = document.createDocumentFragment();
    fragment.append(heading, list);
    return fragment;
}

function renderDiagnostics(diagnostics, sourceCounts = []) {
    diagnosticsBox.innerHTML = "";

    if (!diagnostics || !diagnostics.totals) {
        diagnosticsBox.classList.remove("visible");
        return;
    }

    const totals = diagnostics.totals;
    const grid = document.createElement("div");
    grid.className = "metric-grid";

    grid.append(
        metricTile("Direct raw", totals.directRawCount || 0),
        metricTile("Direct relevant", totals.directRelevantCount || 0),
        metricTile("NewsAPI raw", totals.newsRawCount || 0),
        metricTile("NewsAPI relevant", totals.newsRelevantCount || 0),
        metricTile("Combined relevant", totals.combinedRelevantCount || 0),
        metricTile("Seen filtered", totals.seenFilteredCount || 0),
        metricTile("New returned", totals.returnedCount || 0)
    );

    diagnosticsBox.appendChild(grid);

    const newsApi = renderNewsApiStatus(diagnostics.newsApi);
    if (newsApi) {
        diagnosticsBox.appendChild(newsApi);
    }

    const unseenSources = renderSourceList("New articles by source", sourceCounts);
    if (unseenSources) {
        diagnosticsBox.appendChild(unseenSources);
    }

    const combinedSources = renderSourceList("All relevant articles by source", diagnostics.combinedSourceCounts);
    if (combinedSources) {
        diagnosticsBox.appendChild(combinedSources);
    }

    const feeds = renderFeedList(diagnostics.feeds);
    if (feeds) {
        diagnosticsBox.appendChild(feeds);
    }

    diagnosticsBox.classList.add("visible");
}

function normalizeArticle(article) {
    return {
        title: article.title || "Untitled article",
        source: article.source || "Unknown source",
        url: article.url || "",
        publishedAt: article.publishedAt || "",
        description: article.description || "",
        scoutSource: article.scoutSource || ""
    };
}

function workerEndpoint(path) {
    return new URL(path, WORKER_URL).toString();
}

async function fetchJson(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.error || data.message || `Worker returned ${response.status}`);
    }

    return data;
}

async function postArticleAction(path, article) {
    return fetchJson(workerEndpoint(path), {
        method: "POST",
        headers: {
            "Accept": "application/json",
            "Content-Type": "application/json"
        },
        body: JSON.stringify(article)
    });
}

async function queueArticleForAdmin(index) {
    const article = currentResults[index];

    if (!article) {
        return;
    }

    try {
        const data = await postArticleAction("/scout/accept", article);

        if (!data.accepted) {
            throw new Error(data.error || "Worker did not accept the article.");
        }

        currentResults.splice(index, 1);
        renderResults(currentResults);
        setStatus("Article queued in cloud draft, waiting to be published from Admin.");
    } catch (error) {
        setStatus(`Queue error: ${error.message}`, true);
    }
}

function formatDate(value) {
    if (!value) {
        return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

function renderResults(articles) {
    resultsBox.innerHTML = "";

    if (!articles.length) {
        clearResults("No articles found.");
        return;
    }

    articles.forEach((article, index) => {
        const card = document.createElement("article");
        card.className = "article-card";

        const title = document.createElement("h2");
        title.className = "article-title";

        const titleLink = document.createElement("a");
        titleLink.href = article.url;
        titleLink.target = "_blank";
        titleLink.rel = "noopener noreferrer";
        titleLink.textContent = article.title;
        title.appendChild(titleLink);

        const meta = document.createElement("div");
        meta.className = "article-meta";

        const source = document.createElement("span");
        source.textContent = article.source;
        meta.appendChild(source);

        const published = formatDate(article.publishedAt);
        if (published) {
            const date = document.createElement("span");
            date.textContent = published;
            meta.appendChild(date);
        }

        if (article.description) {
            const description = document.createElement("p");
            description.className = "article-description";
            description.textContent = article.description;
            card.append(title, meta, description);
        } else {
            card.append(title, meta);
        }

        const actions = document.createElement("div");
        actions.className = "article-actions";

        const queue = document.createElement("button");
        queue.type = "button";
        queue.className = "secondary-button";
        queue.textContent = "Queue for Publish";
        queue.addEventListener("click", () => queueArticleForAdmin(index));

        const reject = document.createElement("button");
        reject.type = "button";
        reject.className = "secondary-button";
        reject.textContent = "Reject";
        reject.addEventListener("click", () => rejectArticle(index));

        actions.append(queue, reject);
        card.appendChild(actions);
        resultsBox.appendChild(card);
    });
}

async function rejectArticle(index) {
    const article = currentResults[index];

    if (!article) {
        return;
    }

    try {
        const data = await postArticleAction("/reject", article);

        if (!data.rejected) {
            throw new Error(data.error || "Worker did not reject the article.");
        }

        currentResults.splice(index, 1);
        renderResults(currentResults);
        setStatus("Article rejected and hidden from future Scout runs.");
    } catch (error) {
        setStatus(`Reject error: ${error.message}`, true);
    }
}

function dedupeArticles(articles) {
    const seenUrls = new Set();

    return articles.filter(article => {
        if (!article || !article.url || seenUrls.has(article.url)) {
            return false;
        }

        seenUrls.add(article.url);
        return true;
    });
}

async function loadMetrics() {
    loadMetricsButton.disabled = true;
    setStatus("Loading Scout metrics...");
    clearDiagnostics();

    try {
        const data = await fetchJson(workerEndpoint("/metrics?limit=100"));
        const windows = data.metrics?.windows || [];
        const latest = data.metrics?.recentRuns?.[0];

        diagnosticsBox.innerHTML = "";
        const grid = document.createElement("div");
        grid.className = "metric-grid";

        windows.forEach(windowSummary => {
            const label = windowSummary.hours === 24
                ? "24h returned"
                : windowSummary.hours === 168
                    ? "7d returned"
                    : "30d returned";
            grid.appendChild(metricTile(label, windowSummary.returnedCount || 0));
        });

        if (latest) {
            grid.append(
                metricTile("Last run relevant", latest.totals?.combinedRelevantCount || 0),
                metricTile("Last run seen", latest.totals?.seenFilteredCount || 0),
                metricTile("Last run new", latest.totals?.returnedCount || 0)
            );
        }

        diagnosticsBox.appendChild(grid);

        const activeWindow = windows.find(item => item.hours === 168) || windows[0];
        const sources = renderSourceList("Rolling source totals", activeWindow?.sourceCounts || []);
        if (sources) {
            diagnosticsBox.appendChild(sources);
        }

        diagnosticsBox.classList.add("visible");
        setStatus(`Metrics loaded. ${data.metrics?.retainedRuns || 0} Scout run${data.metrics?.retainedRuns === 1 ? "" : "s"} retained.`);
    } catch (error) {
        setStatus(`Metrics error: ${error.message}`, true);
    } finally {
        loadMetricsButton.disabled = false;
    }
}

async function runScout() {
    const workerUrl = WORKER_URL.trim();

    if (!workerUrl || workerUrl === "PASTE_YOUR_NEW_WORKER_URL_HERE") {
        setStatus("Add your new Worker URL to WORKER_URL in scout.html.", true);
        return;
    }

    const requestUrl = new URL(workerUrl);
    requestUrl.searchParams.set("q", "all");
    requestUrl.searchParams.set("refresh", "1");
    requestUrl.searchParams.set("debug", "1");

    runScoutButton.disabled = true;
    setStatus("Scanning sources...");
    clearResults();
    clearDiagnostics();

    try {
        const response = await fetch(requestUrl.toString(), {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });

        const contentType = response.headers.get("content-type") || "";

        if (!response.ok) {
            throw new Error(`Worker returned ${response.status}`);
        }

        if (!contentType.includes("application/json")) {
            throw new Error("Worker returned something other than JSON.");
        }

        const data = await response.json();

        if (!Array.isArray(data.articles)) {
            throw new Error("Worker JSON must include an articles array.");
        }

        currentResults = dedupeArticles(data.articles.map(normalizeArticle));

        renderResults(currentResults);
        renderDiagnostics(data.diagnostics, data.sourceCounts);
        setStatus(`Scout complete. ${currentResults.length} new article${currentResults.length === 1 ? "" : "s"} found.`);
    } catch (error) {
        currentResults = [];
        clearResults("No articles loaded.");
        setStatus(`Fetch error: ${error.message}`, true);
    } finally {
        runScoutButton.disabled = false;
    }
}
</script>
</body>
</html>
