<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disclosure Press Scout</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #000;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ccc;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-top: 0;
}

.actions {
    margin: 20px 0;
}

button {
    font-size: 16px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid #000;
    background: #fff;
}

button:hover {
    background: #eee;
}

.status {
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #ccc;
    background: #fafafa;
}

.results {
    margin-top: 30px;
}

.result-item {
    border-bottom: 1px solid #ddd;
    padding: 14px 0;
}

.result-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.result-source {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
}

.result-url {
    font-size: 13px;
    word-break: break-all;
    margin-bottom: 10px;
}

.result-actions {
    display: flex;
    gap: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>DISCLOSURE PRESS SCOUT</h1>

<div class="actions">
    <button onclick="fetchUAPHeadlines()">Run Scout</button>
</div>

<div class="status" id="status">
    Status: Ready.
</div>

<div class="results" id="results"></div>

</div>

<script>

let currentResults = [];

function setStatus(message) {
    document.getElementById("status").textContent = "Status: " + message;
}

function runScout() {
    setStatus("Scanning sources...");
    fetchUAPHeadlines();
}

function renderResults(results) {
    const container = document.getElementById("results");
    container.innerHTML = "";

    if (!results.length) {
        container.innerHTML = "<p>No results found.</p>";
        return;
    }

    results.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "result-item";

        div.innerHTML = `
            <div class="result-title">${item.title}</div>
            <div class="result-source">${item.source}</div>
            <div class="result-url">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.url}</a>
            </div>
            <div class="result-actions">
                <button onclick="approveResult(${index})">Approve</button>
                <button onclick="rejectResult(${index})">Reject</button>
            </div>
        `;

        container.appendChild(div);
    });
}

function approveResult(index) {
    alert("Approved: " + currentResults[index].title);
}

function rejectResult(index) {
    currentResults.splice(index, 1);
    renderResults(currentResults);
    setStatus("Result rejected.");
}

async function fetchUAPHeadlines() {

    try {

        const response = await fetch(
            "https://disclosure-scout-worker.disclosurepress.workers.dev?q=UFO"
        );

        const data = await response.json();

        console.log(data);

        setStatus("SUCCESS");

    } catch (error) {

        console.error(error);

        setStatus(error.message);
    }
}

        if (!data.articles || !Array.isArray(data.articles)) {
            setStatus("Scout error: No articles array returned.");
            return;
        }

        currentResults = data.articles.map(article => ({
            title: article.title || "No title",
            source: article.source && article.source.name ? article.source.name : "Unknown source",
            url: article.url || "#"
        }));

        renderResults(currentResults);
        setStatus(`Scout completed. ${currentResults.length} articles found.`);

    } catch (error) {
        console.error("Scout fetch error:", error);
        setStatus("Fetch error: " + error.message);
    }
}

</script>
fetchUAPHeadlines();
    
</script>

</body>
</html>
