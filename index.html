<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disclosure Press</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #000;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 6px 10px;
}

.header {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 50px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -1px;
    text-align: center;
    text-shadow: 1px 1px 0px #aaa;
    margin-bottom: 24px;
}

.columns {
    display: flex;
    gap: 18px;
    align-items: flex-start;
}

.left {
    flex: 2.2;
}

.right {
    flex: 1;
}

.headline {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.13;
    margin-bottom: 5px;
}

.headline a {
    color: #000;
    text-decoration: none;
}

.headline a:hover {
    text-decoration: underline;
}

.red a { color: #cc0000; }
.blue a { color: #0000cc; }
.green a { color: #008000; }

.section-title {
    font-size: 16px;
    font-weight: 900;
    margin: 0 0 8px 0;
    border-bottom: 2px solid #000;
    text-transform: uppercase;
}

.video {
    margin-bottom: 12px;
}

.video-thumb {
    width: 100%;
    max-width: 260px;
    display: block;
    border: 0;
}

.video-title {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.2;
    margin-top: 4px;
}

@media (max-width: 768px) {
    .header {
        font-size: 34px;
    }

    .columns {
        flex-direction: column;
    }

    .headline {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">DISCLOSURE PRESS</div>

<div class="columns">

<div class="left">

<!-- HEADLINES START -->
<div class="headline"><a href="https://www.newsday.com/news/nation/trump-ufos-uap-aliens-pentagon-records-investigation-l20736" target="_blank" rel="noopener noreferrer">Trump keeps UFO world guessing</a></div>
<div class="headline red"><a href="https://www.ibtimes.co.uk/pentagon-pressure-unreleased-uap-videos-1795097" target="_blank" rel="noopener noreferrer">Government under pressure to release the 46 vids</a></div>
<div class="headline"><a href="https://www.msn.com/en-us/news/us/ufo-update-congresswoman-promises-to-show-things-of-nonhuman-origin/ar-AA2210Cz" target="_blank" rel="noopener noreferrer">Luna to hold DISCLOSURE presser</a></div>
<!-- HEADLINES END -->

</div>

<div class="right">

<div class="section-title">VIDEOS</div>

<!-- VIDEOS START -->
<div class="video">
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">
        <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" class="video-thumb">
    </a>
    <div class="video-title">Example video title</div>
</div>
<!-- VIDEOS END -->

</div>

</div>

</div>

</body>
</html>
