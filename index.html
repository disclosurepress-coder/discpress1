<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disclosure Press</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #000;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 6px 10px;
}

.header {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 55px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -1px;
    text-align: center;
    text-shadow: 3px 3px 0px #aaa;
    margin-bottom: 28px;
}

    .tagline {
    display: block;
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px !important;
    color: #b30000 !important;
    font-style: normal;
    font-weight: 700;
    line-height: 1.2;
    margin-top: -10px;
    margin-bottom: 18px;
    text-shadow: none !important;
    letter-spacing: 0.3px;
}

.columns {
    display: flex;
    gap: 18px;
    align-items: flex-start;
}

.left {
    flex: 2.2;
}

.right {
    flex: 1;
}

.headline {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.13;
    margin-bottom: 10px;
}

.headline a {
    color: #000;
    text-decoration: underline;
}

.headline a:visited {
    color: #0000cc;
}

.headline a:hover {
    text-decoration: underline;
}

.red a { color: #cc0000; }
.red a:visited { color: #0000cc; }

.blue a { color: #0000cc; }
.blue a:visited { color: #0000cc; }

.green a { color: #008000; }
.green a:visited { color: #0000cc; }

.section-title {
    font-size: 16px;
    font-weight: 900;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    margin: 0 0 8px 0;
    border-bottom: 2px solid #000;
    text-transform: uppercase;
}

.video {
    margin-bottom: 12px;
}

.video-thumb {
    width: 100%;
    max-width: 260px;
    display: block;
    border: 0;
}

.video-slider {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scroll-snap-type: x mandatory;
}

.video-slider .video {
    min-width: 180px;
    scroll-snap-align: start;
}

.video-slider .video-thumb {
    width: 180px;
    max-width: 180px;
}
    
.video-title {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.1;
    margin-top: 3px;
    max-width: 260px;
    word-wrap: break-word;
}

 .mobile-video-dock {
    display: none;
}   

.footer {
    text-align: center;
    font-size: 11px;
    color: #666;
    padding: 20px 0;
    border-top: 1px solid #ddd;
}

.mobile-footer {
    display: none;
}

.desktop-footer {
    display: block;
    margin-top: 80px;
}
    
@media (max-width: 768px) {
    body {
        overflow-y: auto;
        overflow-x: hidden;
    }

    .container {
        min-height: 100vh;
        display: block;
        padding-bottom: 260px;
    }

    .header {
        font-size: 34px;
    }

    .tagline {
        font-size: 16px !important;
        margin-top: -5px;
        margin-bottom: 12px;
    }

    .columns {
        display: block;
    }

    .left {
        height: auto;
        overflow: visible;
        padding-bottom: 260px;
    }

    .right {
        display: none;
    }

    .headline {
        font-size: 18px;
        margin-bottom: 10px;
    }

    .mobile-video-dock {
        display: flex;
        gap: 10px;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 2px solid #000;
        padding: 6px 10px;
        z-index: 999;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
    }

    .mobile-video-dock .video {
        flex: 0 0 120px;
        margin-bottom: 0;
        scroll-snap-align: start;
    }

    .mobile-video-dock .video-thumb {
        width: 120px;
        max-width: 120px;
    }

    .mobile-video-dock .video-title {
        display: block;
        font-size: 12px;
        line-height: 1.1;
        max-width: 120px;
        word-wrap: break-word;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    DISCLOSURE PRESS
    <div class="tagline">
        Unidentified. Unexplained. Uncensored.
    </div>
</div>
  
<div class="columns">

<div class="left">

<!-- HEADLINES END -->

    <div class="footer mobile-footer">
       © 2026 Disclosure Press. All rights reserved.
    </div>
    
</div>

<div class="right">

<div class="section-title">VIDEOS</div>

<!-- VIDEOS START -->

<!-- VIDEOS END -->

</div>

</div>

<div class="footer desktop-footer">

</div>

</div>

</body>

</div>
</html>
